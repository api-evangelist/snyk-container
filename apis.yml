aid: snyk-container
name: Snyk Container
description: >-
  Snyk Container helps developers find and fix vulnerabilities in container images and Kubernetes workloads. It
  integrates into existing development workflows to provide continuous security monitoring throughout the container
  lifecycle, scanning Docker images, Kubernetes manifests, and Helm charts for known CVEs and misconfigurations.
